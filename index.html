<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceyda'ya Özel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b0b0b;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. EKRAN */
        #screen1 {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)), url('https://i.ibb.co/tpPVv8mq/MG-5763.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            transition: opacity 1s ease;
            z-index: 2;
        }

        #screen1 h1 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            margin-bottom: 30px;
        }

        .loader-bar {
            width: 180px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: #ff3366;
            transition: width 0.1s linear;
        }

        /* 2. EKRAN */
        #screen2 {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 1;
        }

        .card {
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .small-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff3366;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        #screen2 h2 {
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e1e1e1;
        }

        .spotify-btn {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. EKRAN -->
    <div id="screen1">
        <h1>“Dünyanın en güzel manzarası bile senin gözlerin kadar bana huzur veremez Ceyda…”</h1>
        <div class="loader-bar">
            <div class="loader-progress" id="progress"></div>
        </div>
    </div>

    <!-- 2. EKRAN -->
    <div id="screen2">
        <div class="card">
            <img src="https://i.ibb.co/WNvPpDSh/E285694-C-8-DF1-41-D0-AB7-D-1-F98-D2-B5-F555.jpg" alt="Ceyda" class="small-img">
            <h2>Her anımda, her şarkıda sen varsın... İyi ki varsın Ceydam.</h2>
            <button onclick="openSpotifyApp()" class="spotify-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.42.18-.78.6-.9 4.56-1.02 8.52-.6 11.76 1.44.36.24.48.66.24 1.02zm1.44-3.84c-.301.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.41-.48.18-1.02-.06-1.2-.54-.18-.48.06-1.02.54-1.2 4.26-1.32 9.66-.66 13.56 1.74.42.3.6.84.3 1.21zm.12-4.02C13.5 7.32 7.8 7.14 4.62 8.1c-.6.18-1.2-.18-1.38-.78-.18-.6.18-1.2.78-1.38 3.72-1.14 10.14-.9 14.28 1.56.54.32.72 1.02.36 1.56-.3.54-1.02.72-1.56.36z"/></svg>
                Şarkıyı Dinle
            </button>
        </div>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progress');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');

        const interval = setInterval(() => {
            progress += 1;
            progressBar.style.width = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                screen1.style.opacity = '0';
                setTimeout(() => {
                    screen1.style.display = 'none';
                    screen2.style.pointerEvents = 'auto';
                    screen2.style.opacity = '1';
                }, 1000);
            }
        }, 100);

        function openSpotifyApp() {
            // Doğrudan Spotify mobil uygulamasını tetikler
            window.location.href = "spotify:track:2bGnqWLHIIl46xAVTaN8if";

            // Yedeğe web yönlendirmesi ekliyoruz (Uygulama açılamazsa)
            setTimeout(function() {
                window.location.href = "https://open.spotify.com/track/2bGnqWLHIIl46xAVTaN8if";
            }, 1000);
        }
    </script>
</body>
</html>
